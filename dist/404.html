<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Full-Stack Mastery — 21 Day Interview Prep</title>
    <script>
      // GitHub Pages SPA redirect trigger
      (function() {
        var l = window.location;
        if (l.pathname !== '/' && !l.pathname.endsWith('.html')) {
          l.replace(
            l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
            l.pathname.split('/').slice(0, -1).join('/') + '/?/' +
            l.pathname.slice(1).replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
          );
        }
      })();
    </script>
  </head>
  <body></body>
</html>
