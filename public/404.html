<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Full-Stack Mastery — 21 Day Interview Prep</title>
    <script>
      // GitHub Pages SPA redirect — segmentsToKeep=1 for repo pages
      // Encodes only the path AFTER the repo-name segment to avoid base-path duplication.
      (function() {
        var segmentsToKeep = 1;
        var l = window.location;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + segmentsToKeep).join('/') + '/?/' +
          l.pathname.slice(1).split('/').slice(segmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>
